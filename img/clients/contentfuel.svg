<title>content.fuel — wordmark en una línea (contentfuel)</title>
<desc>El nombre dibujado en una sola línea, SIN punto: "contentfuel" corrido con el aire normal entre letras. Para formatos anchos (cabeceras, firmas, barras). Misma letra que el logotipo: el wordmark nunca se escribe con una fuente.</desc>
